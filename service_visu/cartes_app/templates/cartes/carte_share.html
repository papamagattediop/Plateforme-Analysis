<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ carte.variable }} — CensusAnalyse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; }

    .header {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left h1 {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
    }
    .header-left .meta {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
    .badge {
      font-size: 10px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .brand {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      text-decoration: none;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 56px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1>{{ carte.variable }} — {{ carte.dataset_nom }}</h1>
      <div class="meta">
        {{ carte.get_type_carte_display }} · {{ carte.created_at|date:"d/m/Y à H:i" }}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="badge">{{ carte.get_type_carte_display }}</span>
      <a class="brand" href="/">CensusAnalyse</a>
    </div>
  </div>

  <iframe srcdoc="{{ carte.html_carte }}"></iframe>

</body>
</html>
